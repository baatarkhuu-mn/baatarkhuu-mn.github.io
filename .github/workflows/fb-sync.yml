name: Facebook → сайт синк

on:
  schedule:
    - cron: "17 */3 * * *"   # 3 цаг тутам
  workflow_dispatch:          # гараар ажиллуулах товч
    inputs:
      mode:
        description: "sync = Facebook синк, pages = хуваалцах зураг/хуудсыг шинэчлэх (Apify зардалгүй), telegram-test = ботыг шалгах"
        type: choice
        options: [sync, pages, telegram-test]
        default: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # хуваалцах хуудсуудыг (s/) хадгалж commit хийнэ
    steps:
      - name: Telegram тест
        if: inputs.mode == 'telegram-test'
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_ID }}
        run: |
          r=$(curl -s "https://api.telegram.org/bot$TG/sendMessage" --data-urlencode "chat_id=$CHAT" --data-urlencode "text=✅ baatarkhuu.mn бот холбогдлоо. Шинэ Facebook пост сайтад орох бүрт энд мэдэгдэл ирнэ.")
          echo "$r" | grep -q '"ok":true' && echo "Telegram OK" || { echo "$r"; exit 1; }
      - uses: actions/checkout@v4
        if: inputs.mode != 'telegram-test'
      - uses: actions/setup-node@v4
        if: inputs.mode != 'telegram-test'
        with:
          node-version: 20
      - run: node scripts/fb-sync.mjs
        if: inputs.mode != 'telegram-test' && inputs.mode != 'pages'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ID }}
          SUPABASE_URL: https://qtmueuyxqfgekbacymiu.supabase.co
          FB_PAGE_URL: https://www.facebook.com/ts.baatarkhuu
          RESULTS_LIMIT: "10"
      - name: Хуваалцах хуудас (Facebook preview)
        if: inputs.mode != 'telegram-test'
        run: node scripts/share-pages.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://qtmueuyxqfgekbacymiu.supabase.co
      - name: Өөрчлөлтийг хадгалах
        if: inputs.mode != 'telegram-test'
        run: |
          git config user.name "baatarkhuu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A s index.html namtar huuli tusul medee video tailan holboo medee-delgerengui huuli-delgerengui tusul-delgerengui arga-delgerengui tailan-delgerengui
          if git diff --cached --quiet; then echo "Өөрчлөлт алга"; exit 0; fi
          git commit -m "Хуваалцах хуудсууд шинэчлэв"
          git pull --rebase origin main && git push origin HEAD:main
